name: Test the replay helper

# Runs the tests of chapters/notebooks/book_client.py, the client every notebook replays its recorded
# model responses through, and of scripts/claude_build.py and scripts/check_builds.py, which run and check
# the chapters' Claude Code builds. Then checks every recording (each names its model, date and SDK version,
# keeps no response header, and is keyed to the request it stores) and every build in builds/.
#
# No step reaches the Anthropic API or runs Claude Code. The tests use a fake API and a fake claude
# command, with responses written for them.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install the SDK version the notebooks pin
        run: pip install --quiet -r tests/requirements.txt

      - name: Run the helper's tests
        run: python -m pytest -q tests/

            - name: Check the recordings
        run: python3 scripts/check_recordings.py

      - name: Check the Claude Code builds
        run: python3 scripts/check_builds.py
